[package]
name = "litgraph-core"
version = "0.2.0"
edition = "2021"
description = "Core logic for LitGraph: .md parser, models, AI prompts (no Tauri deps)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.13"
regex = "1.10"
unicode-segmentation = "1.11"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
phf = "0.11"
flate2 = "1.0"
petgraph = "0.6"

# v0.6.0 / Phase 2 Step 3: Burn scorer — lightweight MLP for refined confidence.
# Backend: ndarray (pure Rust, no BLAS) for portability + cross-platform.
# When training matures we may switch to a faster backend (tch-cpu / wgpu).
burn = { version = "0.14", default-features = false, features = ["ndarray"] }

[lib]
name = "litgraph_core"
path = "src/lib.rs"
