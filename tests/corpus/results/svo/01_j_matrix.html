<title>LitGraph: J-матрица конфликта</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F8FAFC;
    font-family: system-ui, 'Noto Sans SC', 'Segoe UI', sans-serif;
    color: #0F172A;
    min-height: 100vh;
  }
  #chart { width: 980px; height: 700px; margin: 40px auto; }
  .legend-bar {
    max-width: 980px; margin: 0 auto 16px; padding: 16px 24px;
    background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px;
  }
  .header-block { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #E2E8F0; }
  .title { font-size: 19px; font-weight: bold; color: #0F172A; }
  .subtitle { font-size: 12px; color: #475569; margin-top: 4px; }
  .legend-items { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #475569; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }
  .edge-line { width: 28px; height: 0; border-top: 3px solid; }
  .edge-line.dashed { border-top-style: dashed; }
</style>

  <div class="legend-bar">

      </div>
      <div class="legend-item">
        <span class="edge-line" style="border-color:#DC2626"></span>

      </div>
      <div class="legend-item">
        <span class="edge-line" style="border-color:#64748B"></span>
        Нейтральное действие
      </div>
      <div class="legend-item">
        <span class="edge-line dashed" style="border-color:#475569"></span>

      <div class="legend-item">
        Толщина линии ~ вес действия

    </div>
  </div>
