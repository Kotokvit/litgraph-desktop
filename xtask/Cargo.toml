[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
phf_codegen = "0.11"
quick-xml = "0.36"
reqwest = { version = "0.12", features = ["blocking"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.0"
